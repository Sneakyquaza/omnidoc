[package]
name = "omnidoc"
version = "0.1.0"
description = "Éditeur de bureau universel"
authors = ["Sneakyquaza"]
license = "MIT"
edition = "2021"

[lib]
name = "omnidoc_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
specta = { version = "=2.0.0-rc.25", features = ["derive", "serde_json"] }
specta-typescript = "0.0.12"
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }
notify = "8"
tempfile = "3"
infer = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
uuid = { version = "1", features = ["v4"] }
encoding_rs = "0.8.42"
chardetng = "1.0.0"
pulldown-cmark = "0.13.4"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp", "tiff", "ico"] }
kamadak-exif = "0.6"
base64 = "0.23"
resvg = "0.48"
usvg = "0.48"
lopdf = "0.45"
csv = "1"
calamine = "0.36"
rust_xlsxwriter = "0.99"
zip = { version = "9", default-features = false, features = ["deflate"] }
quick-xml = "0.42"
rusqlite = { version = "0.40", features = ["bundled", "hooks", "limits"] }
ammonia = "4"
tar = "0.4.46"
flate2 = "1.1.10"
sevenz-rust2 = "0.24.0"
lofty = "0.25.4"
scraper = "0.27.0"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"
