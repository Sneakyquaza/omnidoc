name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE*'
      - '.github/ISSUE_TEMPLATE/**'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE*'
      - '.github/ISSUE_TEMPLATE/**'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'push' && '["ubuntu-22.04"]' || '["ubuntu-22.04","windows-latest","macos-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Dépendances Linux
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libssl-dev librsvg2-dev \
            libayatana-appindicator3-dev libxdo-dev pkg-config

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: pnpm install --frozen-lockfile

      - name: Noms de fichiers en conflit de casse
        if: matrix.os == 'ubuntu-22.04'
        run: |
          dups=$(git ls-files | sort -f | uniq -di)
          if [ -n "$dups" ]; then echo "Conflit de casse : $dups"; exit 1; fi

      - name: Vérifications complètes (Linux)
        if: matrix.os == 'ubuntu-22.04'
        run: ./scripts/check.sh

      - name: Build (sans bundle)
        run: pnpm tauri build --debug --no-bundle

  e2e:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Dépendances Linux
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libssl-dev librsvg2-dev \
            libayatana-appindicator3-dev libxdo-dev pkg-config \
            webkit2gtk-driver xvfb unzip gstreamer1.0-tools gstreamer1.0-plugins-good \
            gstreamer1.0-libav

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/tauri-driver
          key: tauri-driver-${{ runner.os }}-v2

      - run: pnpm install --frozen-lockfile

      - name: tauri-driver
        run: |
          if ! command -v tauri-driver >/dev/null; then cargo install tauri-driver --locked; fi

      - name: Fixtures
        run: pnpm e2e:fixtures

      - name: Build (debug, hook d'erreurs E2E)
        run: pnpm e2e:build

      - name: Tests E2E
        run: pnpm e2e
